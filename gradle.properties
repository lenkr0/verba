# App version. A release tag must be "v" + this value (checked in CI).
# versionCode is derived from it: 1.2.3 -> 10203.
verba.version=0.8.0

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Maven Central rate-limits CI runners (HTTP 429), which Gradle retries: more
# attempts with longer pauses (2, 4, 8 … 64 s) than the default 3 from 1 s
systemProp.org.gradle.internal.network.retry.max.attempts=7
systemProp.org.gradle.internal.network.retry.initial.backOff=2000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
