name: CI

# Every push: build, unit tests, lint and the permission check.
# Pull requests and main: additionally the instrumented tests on Android 13
# (API 33, minSdk, like the Boox Go 7) and Android 16 (API 36, targetSdk).
# The emulator images have no Google Play services, like the target devices.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: NDK and CMake (text recognition; versions as in app/build.gradle.kts)
        run: |
          # yes accepts licenses; without pipefail its broken pipe doesn't fail the step
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Dictionary builder tests
        run: python3 -m unittest discover -s tools/dictionary/tests

      - name: No unexpected permissions
        run: tools/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: APK size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "Release APK: $((size / 1024)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Debug APK for testing this commit
        uses: actions/upload-artifact@v7
        with:
          name: verba-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-build
          path: app/build/reports

  instrumented:
    name: Instrumented tests (API ${{ matrix.api }})
    needs: build
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: NDK and CMake (text recognition; versions as in app/build.gradle.kts)
        run: |
          # yes accepts licenses; without pipefail its broken pipe doesn't fail the step
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-api-${{ matrix.api }}
          path: app/build/reports
